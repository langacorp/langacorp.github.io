name: data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: python3 .github/collect.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.c.outputs.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898248+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m 'data: refresh'
          git push
